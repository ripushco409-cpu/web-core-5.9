<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Document</title>
    <link rel="stylesheet" href="style.css" >
  </head>
  <body>
    <img src="/bg.jpg" alt="Background Image" class="bg.picture" >

    <div class="container">
      <div class="top">
        <h2>Get iintoo it today</h2>
        <h4>There is no charge or obligation upon registration</h4>
      </div>

      <div class="middle-1">
        <button class="btn-1">Register with Facebook</button>
        <button class="btn-2">Register with LinkedIn</button>
      </div>

      <span class="text-or">OR</span>

      <div class="inputs">
        <input type="email" id="email-input" class="input-1">
        <span class="text-email">Email</span>
        <input type="text" id="phone-input" class="input-2">
        <span class="text-phone">Phone</span>
      </div>

      <h3>What type of investor are you?</h3>
      <h5>Select the type of investor you are below.</h5>

      <div class="options">

        <input type="radio" name="option" value="1" >
        <label for="individual">Individual</label>
        <span class="tooltip" data-tooltip="i am a natural person investing on my own behalf as a sole owner,joint tenant,or tenant in common."><img src="./tooltip.png" class="icon"></span>


        <input type="radio" name="option" value="2" >
        <label for="business">Business</label>
        <span class="tooltip" data-tooltip="i am a natural person investing on my own behalf as a sole owner,joint tenant,or tenant in common."><img src="./tooltip.png" class="icon"></span>

        <input type="radio" name="option" value="3" >
        <label for="ira">IRA</label>
        <span class="tooltip" data-tooltip="i am a natural person investing on my own behalf as a sole owner,joint tenant,or tenant in common."><img src="./tooltip.png" class="icon"></span>

        <input type="radio" name="option" value="4" >
        <label for="trust">Trust</label>
        <span class="tooltip" data-tooltip="i am a natural person investing on my own behalf as a sole owner,joint tenant,or tenant in common."><img src="./tooltip.png" class="icon"></span>
      </div>
         
         <div class="last">
         <input type="checkbox">
         <span class="check">i agree the terms receiving notifications from iinto</span>
         <a href="https://example.com">View full terms</a>
         </div>

         <button class="bttn">Create account</button>
    </div>
  </body>
</html>
